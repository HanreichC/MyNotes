<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: mynotes:; connect-src 'self'">
<title>MyNotes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="window">
  <!-- #titlebar stays before #sidebar: Chromium takes a scrolled #tab-list's no-drag area unclipped, so it also covers the sidebar's head unless that comes later. -->
  <header id="titlebar">
    <div id="tabs" class="ms-glass ms-glass--capsule" role="tablist" aria-label="Offene Notizen">
      <div id="tab-list" class="ms-scroll"></div>
      <button id="tab-new" class="round-btn" aria-label="Neuer Tab" title="Neuer Tab (Strg+T). Rechtsklick: mehr öffnen"></button>
    </div>
    <div id="window-buttons" class="ms-glass ms-glass--capsule">
      <button id="win-min" class="round-btn" aria-label="Minimieren" title="Minimieren"></button>
      <button id="win-max" class="round-btn" aria-label="Maximieren" title="Maximieren"></button>
      <button id="win-close" class="round-btn ms-button--close" aria-label="Schließen" title="Schließen"></button>
    </div>
  </header>

  <aside id="sidebar" class="ms-glass" aria-label="Notizen">
    <div id="brand">
      <span class="ms-title2">MyNotes</span>
      <button id="side-toggle" class="round-btn round-btn--s"></button>
    </div>
    <div class="side-tools">
      <input id="filter" class="ms-field" type="search" placeholder="Filtern" aria-label="Notizen filtern">
      <button id="new-folder" class="icon-btn" aria-label="Neuer Ordner" title="Neuer Ordner"></button>
    </div>
    <div id="tree" class="ms-scroll" role="tree" aria-label="Notizbaum"></div>
    <div class="side-foot">
      <button id="btn-search" class="side-link"></button>
      <button id="btn-trash" class="side-link"></button>
      <button id="btn-settings" class="side-link"></button>
      <span id="version" class="ms-section ms-num"></span>
    </div>
    <div id="side-resize" role="separator" aria-orientation="vertical" aria-label="Breite der Seitenleiste" tabindex="0"></div>
  </aside>

  <main id="main">
    <div id="banner" hidden role="alert"></div>
    <div id="compare-bar" class="ms-glass ms-glass--capsule" role="toolbar" aria-label="Vergleichen" hidden></div>
    <section id="editors" class="ms-card">
      <div id="split-head" hidden></div>
      <div id="split-drop" hidden>
        <div class="split-zone ms-callout" data-side="0">Links anzeigen</div>
        <div class="split-zone ms-callout" data-side="1">Rechts anzeigen</div>
      </div>
    </section>
    <footer id="status" class="ms-caption ms-num">
      <span id="st-save" role="status"></span>
      <span id="st-right">
        <span id="st-pos"></span>
        <button id="st-format" class="st-btn" title="JSON formatieren (Strg+Alt+J)" hidden>Formatieren</button>
        <button id="st-mode" class="st-btn"></button>
        <button id="st-enc" class="st-btn"></button>
        <button id="st-eol" class="st-btn"></button>
      </span>
    </footer>
  </main>
</div>
<div id="layer"></div>
<script type="module" src="app.js"></script>
</body>
</html>
